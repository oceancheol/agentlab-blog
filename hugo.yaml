baseURL: "https://oceancheol.github.io/agentlab-blog/"
languageCode: "ko-kr"
title: "AgentLab"
theme: "stack"

pagination:
  pagerSize: 10

defaultContentLanguage: ko

params:
  mainSections:
    - posts
  featuredImageField: image

  footer:
    since: 2026

  dateFormat:
    published: "2006-01-02"
    lastUpdated: "2006-01-02"

  sidebar:
    compact: false
    emoji: "🤖"
    subtitle: "AI 소식, 생산성 도구, 에이전트 운영 노트"
    avatar: "img/avatar.jpg"

  article:
    toc: true
    readingTime: true

  colorScheme:
    toggle: true
    default: auto

  widgets:
    homepage:
      - type: search
      - type: tag-cloud
        params:
          limit: 20
    page:
      - type: toc

menu:
  main:
    - name: "홈"
      url: "/"
      weight: 1
    - name: "글 목록"
      url: "/post/"
      weight: 2
    - name: "태그"
      url: "/tags/"
      weight: 3

  social:
    - name: "GitHub"
      identifier: "github"
      url: "https://github.com/oceancheol"
      weight: 1
